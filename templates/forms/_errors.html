{% if form.errors %}
<div class="form-errors" tabindex="-1" role="alert" id="form-errors">
    <h2>There are errors in this form</h2>
    <ul>
        {% for field in form %}
            {% for error in field.errors %}
                <li><a href="#id_{{ field.name }}">{{ field.label }}: {{ error }}</a></li>
            {% endfor %}
        {% endfor %}
        {% for error in form.non_field_errors %}
            <li>{{ error }}</li>
        {% endfor %}
    </ul>
</div>
{% endif %}
