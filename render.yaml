services:
  - type: web
    name: hesper
    runtime: python
    plan: free
    buildCommand: >-
      pip install uv &&
      uv sync --frozen --no-dev &&
      uv run python manage.py collectstatic --no-input &&
      uv run python manage.py migrate --noinput
    startCommand: uv run gunicorn config.wsgi:application --bind 0.0.0.0:$PORT
    healthCheckPath: /healthz
    envVars:
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: ALLOWED_HOSTS
        sync: false
      - key: CSRF_TRUSTED_ORIGINS
        sync: false
      - key: ALERT_SOURCE
        value: alerce
      - key: ALERT_RETENTION_DAYS
        value: "7"
      - key: INGEST_MAX_MAGNITUDE
        value: "20"
      - key: DATABASE_SSL_REQUIRE
        value: "true"
      - key: CONN_MAX_AGE
        value: "60"
      - key: CONN_HEALTH_CHECKS
        value: "true"
      - key: SECURE_HSTS_SECONDS
        value: "3600"
