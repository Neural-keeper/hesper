services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: hesper
      POSTGRES_USER: hesper
      POSTGRES_PASSWORD: hesper
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hesper -d hesper"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build: .
    command: [".venv/bin/gunicorn", "config.wsgi:application", "--bind", "0.0.0.0:8000"]
    environment:
      DEBUG: "True"
      SECRET_KEY: development-only-secret
      ALLOWED_HOSTS: localhost,127.0.0.1
      DATABASE_URL: postgres://hesper:hesper@db:5432/hesper
    ports:
      - "8000:8000"
    healthcheck:
      test:
        [
          "CMD",
          ".venv/bin/python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/', timeout=2)",
        ]
      interval: 5s
      timeout: 5s
      retries: 12
    depends_on:
      db:
        condition: service_healthy

  worker:
    build: .
    command: [".venv/bin/python", "manage.py", "run_ingest"]
    environment:
      DEBUG: "True"
      SECRET_KEY: development-only-secret
      DATABASE_URL: postgres://hesper:hesper@db:5432/hesper
    depends_on:
      web:
        condition: service_healthy

volumes:
  postgres_data:
