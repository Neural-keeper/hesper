name: Database backup

on:
  schedule:
    - cron: "30 3 * * 0"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-client
      - name: Dump Neon database
        env:
          DATABASE_URL: ${{ secrets.NEON_DIRECT_DATABASE_URL }}
        run: |
          set -eu
          mkdir -p backups
          pg_dump "$DATABASE_URL" --format=custom --file="backups/hesper-$(date -u +%Y%m%dT%H%M%SZ).dump"
      - uses: actions/upload-artifact@v4
        with:
          name: hesper-database-backup-${{ github.run_id }}
          path: backups/*.dump
          retention-days: 7
